<!DOCTYPE html>
<html lang="{{ lang_tag(settings.default_language) }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ settings.title }}{% endblock %}</title>
  {%- if page_description %}
  <meta name="description" content="{{ page_description }}" />
  {%- endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url('css/styles.css') }}" />
  {%- block head %}{% endblock %}
</head>
<body>
  {% include "partials/mobile_header.html" %}
  {% include "partials/mobile_drawer.html" %}

  <div class="shell">
    {% include "partials/sidebar.html" %}

    <main class="content">
{% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url('js/site.js') }}"></script>
  {%- block scripts %}{% endblock %}
</body>
</html>
