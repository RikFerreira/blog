# Line icons for the theme, lifted from the frontend handoff.
#
# Actions are icons rather than text buttons, drawn at 1.75px on a 24x24 grid.
# `body` is everything inside <svg>; `linecap = "square"` is set on the icons
# the handoff draws with square ends.

[icons.menu]
body = '<line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/>'

[icons.lattes]
body = '<path d="M4 19.5V4h12l4 4v11.5H4z"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="13" y2="15"/>'

[icons.orcid]
body = '<circle cx="12" cy="12" r="9"/><line x1="9" y1="9" x2="9" y2="16"/><path d="M12.5 9h2a3 3 0 0 1 0 6h-2V9z"/>'

