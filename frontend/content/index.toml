# Level 1: the homepage, and everything the whole site reads.

[site]
title            = "rikalves.com"
base_url         = "/"
theme            = "blog-plain"
default_language = "en"
languages        = ["en", "pt"]

[profile]
name = "Rik Ferreira Alves"
role = "GIS Analyst"
tagline.en = "Geographer focused on GIS, remote sensing and environmental modelling. I build spatial analyses, geospatial tools and applied research on water resources and Cerrado landscapes."
tagline.pt = "Geógrafo focado em geoprocessamento, sensoriamento remoto e modelagem ambiental. Desenvolvo análises espaciais, ferramentas em SIG e pesquisas aplicadas sobre recursos hídricos e paisagens do Cerrado."

# How many of each the homepage shows, newest first.
[home]
projects     = 2
posts        = 1
publications = 1

