# The AOI map. `style` is any MapLibre style URL; ${MAP_TILES_KEY} is filled
# in from the environment at build time. Without that variable the build warns
# and the map falls back to a plain background, so a local run needs no key.
#
# line_width is in pixels: 1.9px is about the 0.5mm base outline.
[map]
style        = "https://api.maptiler.com/maps/dataviz-light/style.json?key=${MAP_TILES_KEY}"
max_vertices = 500
line_color   = "#111111"
line_width   = 1.9
fill_color   = "#111111"
fill_opacity = 0.06
active_color = "#c83223"
padding      = 24
max_zoom     = 9
