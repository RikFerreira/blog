server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/geo+json application/xml
                    image/svg+xml;

    # MapLibre is loaded as an ES module. nginx's default mime.types has no
    # entry for .mjs, and a module served as text/plain is refused by the
    # browser, so name it here.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        expires      7d;
        add_header   Cache-Control "public";
    }

    location ~* \.geojson$ {
        types { }
        default_type application/geo+json;
        expires      1h;
        add_header   Cache-Control "public, must-revalidate";
    }

    # Unlike Hugo, the generator does not hash asset file names: styles.css
    # keeps its name across deploys. So nothing is immutable — text that can
    # change on any deploy revalidates, and media that is replaced by
    # uploading a new file gets a modest cache.
    location ~* \.(css|js)$ {
        expires    1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Media is not fingerprinted either: a cover replaced in place keeps its
    # name, so a long TTL strands the old bytes in every cache in front of
    # this one, Cloudflare included. Revalidate like the text assets.
    location ~* \.(woff2?|png|jpe?g|gif|svg|webp|avif|ico|mp4|webm|pdf)$ {
        expires    1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
