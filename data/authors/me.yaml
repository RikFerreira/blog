role: GIS Analyst

bio: |
  Geographer working on the development and maintenance of geographic
  databases and GIS solutions, with a background in remote sensing and
  digital image processing applied to environmental, basic sanitation and
  urban planning projects.

  Open and independent solutions are a principle: they buy productivity and
  autonomy, and take bureaucracy out of work that depends on GIS.

  MSc in Geography from the Federal University of Uberlândia (2026), with a
  dissertation mapping Cerrado wetlands — *veredas* — in the Pandeiros river
  basin from Harmonized Landsat and Sentinel-2 (HLS) spectral indices,
  Copernicus DEM morphometrics and supervised machine learning.

